[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icheck"
version = "1.0.0"
description = "Verify that a text output follows a set of written instructions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
icheck = "icheck.cli:main"

[tool.setuptools.packages.find]
include = ["icheck*"]
